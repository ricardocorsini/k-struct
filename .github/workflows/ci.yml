name: KStruct CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: google-chrome --version
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-validation
          path: test-results/
          retention-days: 7
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/solver-runner -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path crates/solver-runner/Cargo.toml
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-locks-${{ runner.os }}
          path: |
            src-tauri/Cargo.lock
            crates/solver-runner/Cargo.lock
          retention-days: 7
  numerical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .oofem-dist/source
            .oofem-dist/build
          key: oofem-ubuntu-24.04-${{ hashFiles('crates/solver-runner/oofem.json', 'scripts/stage-oofem.mjs') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run oofem:stage
      - name: Analytic benchmarks with real OOFEM
        run: OOFEM_BIN="$GITHUB_WORKSPACE/.oofem-dist/build/bin/oofem" npm test
      - name: Spatial launch and results with real OOFEM
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: OOFEM_BIN="$GITHUB_WORKSPACE/.oofem-dist/build/bin/oofem" npm run test:e2e -- spatial.spec.ts
      - uses: dtolnay/rust-toolchain@stable
      - name: Native process integration with real OOFEM
        env:
          OOFEM_BIN: ${{ github.workspace }}/.oofem-dist/build/bin/oofem
          KSTRUCT_RESOURCE_DIR: ${{ github.workspace }}/src-tauri/resources
        run: cargo test --locked --manifest-path crates/solver-runner/Cargo.toml -- --ignored
